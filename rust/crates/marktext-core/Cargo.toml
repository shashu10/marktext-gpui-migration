[package]
name = "marktext-core"
version.workspace = true
edition.workspace = true
license.workspace = true
description = "Migrated Rust core subsystems for MarkText -> MarkText-GPUI incremental migration"

[dependencies]
libc = "0.2"
regex = "1"
serde = { version = "1", features = ["derive"] }
serde_json = "1"

[[bin]]
name = "marktext-core-cli"
path = "src/bin/marktext-core-cli.rs"
